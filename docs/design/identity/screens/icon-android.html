<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Harness · App icon: Android adaptive and themed</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
  .big-mark { display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  .big-mark svg { width: 220px; height: 220px; }
  .construct { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; place-items: center; }
  .construct svg { width: 256px; height: 256px; }
  .lockup { display: flex; align-items: center; gap: 14px; padding: 22px 24px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); min-width: 0; overflow: hidden; }
  .lockup svg { width: 44px; height: 44px; color: var(--accent); flex: none; }
  .lockup .w { font-size: clamp(18px, 2vw, 24px); font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lockup .w small { display: block; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .lockup.cli { font-size: 20px; }
  .lockup.cli .w { font-size: 17px; }
  .lockup.cli .w b { color: var(--accent); font-weight: 500; }
  .lockup.light { background: #f3f3f1; color: #1b1a19; border-color: #e1e0dc; }
  .lockup.light svg { color: #a0640a; }
  .lockup.light .w small { color: #66635f; }
  .iconrow { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
  .iconrow figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .iconrow figcaption { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .homescreen { background: linear-gradient(160deg, #22262f, #0b0c10 70%); border-radius: 18px; padding: 22px; display: grid; grid-template-columns: repeat(4, 60px); gap: 22px 18px; justify-content: center; width: max-content; }
  .homescreen figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 500 10px/1 -apple-system, system-ui, sans-serif; color: #fff; }
  .homescreen .app { width: 60px; height: 60px; border-radius: 22.37%; display: grid; place-items: center; font-size: 26px; }
  .masks { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .masks figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .circle { border-radius: 50%; }
  .rsq { border-radius: 20%; }
  .statusbar { background: #1f2229; border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; font: 500 12px/1 Roboto, system-ui, sans-serif; color: #fff; width: 300px; }
  .statusbar .sp { flex: 1; }
  .statusbar svg { width: 16px; height: 16px; color: #fff; }
  .menubar { border-radius: 8px; padding: 0 12px; height: 26px; display: flex; align-items: center; gap: 16px; font: 500 12px/1 -apple-system, system-ui, sans-serif; width: 100%; }
  .menubar.light { background: #e9e7e3; color: #222; }
  .menubar.dark { background: #2a2a2e; color: #eee; }
  .menubar .sp { flex: 1; }
  .menubar .g { position: relative; width: 18px; height: 18px; display: grid; place-items: center; }
  .menubar .g svg { width: 16px; height: 16px; color: currentColor; }
  .menubar .g.off { opacity: 0.4; }
  .menubar .g.wait::after { content: ""; position: absolute; top: -1px; right: -2px; width: 7px; height: 7px; border-radius: 4px; background: #e8a33d; border: 1.5px solid currentColor; }
  .menubar .lbl { font-size: 10px; opacity: 0.6; }
  .fav { display: flex; gap: 16px; align-items: flex-end; }
  .fav figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .fav .tab { background: #2b2b2e; border-radius: 8px 8px 0 0; padding: 7px 12px; display: flex; align-items: center; gap: 8px; font: 500 12px/1 system-ui, sans-serif; color: #ddd; }
  .fav .tab svg { width: 16px; height: 16px; }
  .fav .tab .sq { width: 16px; height: 16px; border-radius: 3px; background: #0d0d0d; display: grid; place-items: center; }
  .splash { width: 220px; height: 476px; border-radius: 30px; display: grid; place-items: center; border: 1px solid var(--border); }
  .splash svg { width: 96px; height: 96px; }
  .banner { background: linear-gradient(180deg, #1c1a17, #0d0d0d); border: 1px solid var(--border); border-radius: 14px; padding: 36px 40px; display: flex; align-items: center; gap: 28px; }
  .banner svg { width: 88px; height: 88px; color: var(--accent); flex: none; }
  .banner .t { display: flex; flex-direction: column; gap: 8px; }
  .banner .t b { font-size: 30px; letter-spacing: -0.02em; }
  .banner .t p { color: var(--muted); font-size: 14px; }
  .banner .t .ag { display: flex; gap: 8px; margin-top: 6px; }
  .agchip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 3px 9px 3px 5px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--muted); }
  .agchip .agent { width: 16px; height: 16px; border-radius: 4px; font-size: 8px; }
  .specs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .specs th, .specs td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .specs th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .specs td:first-child { white-space: nowrap; }
  .tbl-wrap { overflow-x: auto; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
</style>
<style>
  body { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .proto-h { font-size: 12px; color: var(--muted); }
  .proto-h b { color: var(--fg); }
  .proto-h a { color: var(--accent); }
</style>

      <figure><svg viewBox="0 0 108 108" width="96" height="96" class="squircle"><rect width="108" height="108" fill="#0d0d0d"/><use href="#rh-mark" x="18" y="18" width="72" height="72" color="#e8a33d"/></svg>squircle</figure>
      <figure><svg viewBox="0 0 108 108" width="96" height="96" class="circle"><rect width="108" height="108" fill="#0d0d0d"/><rect x="18" y="18" width="72" height="72" fill="none" stroke="#f3dc7a" stroke-dasharray="2 2" stroke-width="0.8"/><use href="#rh-mark" x="18" y="18" width="72" height="72" color="#e8a33d"/></svg>zona segura 66 dp</figure>
      <figure style="margin-left:14px"><svg viewBox="0 0 108 108" width="96" height="96" class="circle"><rect width="108" height="108" fill="#e9ddc8"/><use href="#rh-mark-bold" x="24" y="24" width="60" height="60" color="#4a3a1e"/></svg>temático · claro</figure>
      <figure><svg viewBox="0 0 108 108" width="96" height="96" class="circle"><rect width="108" height="108" fill="#3b3327"/><use href="#rh-mark-bold" x="24" y="24" width="60" height="60" color="#f0dcbc"/></svg>temático · escuro</figure>
