name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test & lint
    # Whole monorepo on macOS (launchd, plutil, Keychain, the iOS app).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: brew install ripgrep tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  linux:
    name: Daemon on Linux
    # The daemon also runs on Linux (systemd, secret-tool); macOS-only tests are skipped here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux ripgrep zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test --filter '@claude-remote/daemon...'
      - run: bash -n install.sh
      # Windows installer: parse and lint with the PowerShell preinstalled on the runner.
      - name: Check install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error -ErrorAction Continue $_.ToString() }; exit 1 }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }
